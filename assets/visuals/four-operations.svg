<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470">
<rect width="1180" height="470" fill="#FFFFFF"/>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">The four operations (LangChain taxonomy, 2025)</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Write, select, compress, isolate: the course devotes a module block to each, and the capstone composes all four.</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="150" width="250" height="170" rx="8" fill="#E0F2FE"/>
<text x="165.0" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">WRITE</text>
<text x="165.0" y="231" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">Save context outside</text>
<text x="165.0" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">the window</text>
<text x="165.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">Lessons 06-09, 21-22</text>
<line x1="292" y1="235" x2="320" y2="235" stroke="#0891B2" stroke-width="3"/>
<polygon points="320,235 310,229 310,241" fill="#0891B2"/>
