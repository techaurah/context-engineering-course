<text x="1017.0" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">ISOLATE</text>
<text x="1017.0" y="231" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">Split work across</text>
<text x="1017.0" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">clean windows</text>
<text x="1017.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">Lesson 23</text>
<text x="40" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#475569" text-anchor="start">Anthropic's framing adds the goal: the smallest set of high-signal tokens that maximises the desired outcome.</text>
