<text x="449.0" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">SELECT</text>
<text x="449.0" y="231" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">Pull in what the</text>
<text x="449.0" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">step needs</text>
<text x="449.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">Lessons 10-13</text>
<line x1="576" y1="235" x2="604" y2="235" stroke="#0891B2" stroke-width="3"/>
<polygon points="604,235 594,229 594,241" fill="#0891B2"/>
