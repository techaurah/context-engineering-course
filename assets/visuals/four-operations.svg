<text x="733.0" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">COMPRESS</text>
<text x="733.0" y="231" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">Keep only the tokens</text>
<text x="733.0" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">that carry facts</text>
<text x="733.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0B1F4A" text-anchor="middle">Lessons 14-17</text>
<line x1="860" y1="235" x2="888" y2="235" stroke="#0891B2" stroke-width="3"/>
<polygon points="888,235 878,229 878,241" fill="#0891B2"/>
